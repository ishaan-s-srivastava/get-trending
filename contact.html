<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Trending</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="wrapper">
            <header>
                <nav>
                    <div class="menuButtons">
                        <a href="index.html">Home</a>
                        <a href="find-an-influencer.html">Find An Influencer</a>
                        <a href="stories.html">Stories</a>
                        <a href="contact.html">Contact Us</a>
                    </div>
                </nav>
            </header>
            <h2 id="titleCard">Contact Us</h2>

            <form action="#">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
                <br>

                <button type="submit">Send Message</button>
            </form>


        </div>
    


    <footer>
        <h2>Check out our socials:</h2>
        <button class="facebook"></button>
        <button class="twitter"></button>
        <button class="instagram"></button>
    </footer>

    <style>
                
        form {
            display: flex;
            flex-direction: column;
            width: 500px;
            margin: 40px auto;
            padding: 30px;
            background-color: #5D737E;
            border-radius: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-bottom: 175px;
        }

        form label {
            color: #F0F7EE;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 18px;
            margin-bottom: 5px;
        }

        form input,
        form select,
        form textarea {
            margin-bottom: 20px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        form button {
            background-color: #87BBA2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        form button:hover {
            background-color: #6fa58c;
        }

    </style>

    


    
    
</body>


</html>
